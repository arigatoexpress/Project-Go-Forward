name: Verify Domain for Cloud Run

on:
  workflow_dispatch:

env:
  PROJECT_ID: tho-ai-agent
  DOMAIN: texashomeoutlet.com

jobs:
  verify-domain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF, keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Attempt domain verification and capture output
        run: |
          echo "## Domain Verification for ${{ env.DOMAIN }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### gcloud domains verify output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          gcloud domains verify ${{ env.DOMAIN }} --project=${{ env.PROJECT_ID }} 2>&1 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### gcloud domains list" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          gcloud domains list --project=${{ env.PROJECT_ID }} 2>&1 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### DNS Records for ${{ env.DOMAIN }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          dig +short A ${{ env.DOMAIN }} >> $GITHUB_STEP_SUMMARY 2>&1 || true
          dig +short NS ${{ env.DOMAIN }} >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next steps:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Add the verification TXT record to Turbify/Route 53" >> $GITHUB_STEP_SUMMARY
          echo "2. Wait for DNS propagation (up to 5 min with TTL 300)" >> $GITHUB_STEP_SUMMARY
          echo "3. Run the Add Custom Domain Mappings workflow again" >> $GITHUB_STEP_SUMMARY
