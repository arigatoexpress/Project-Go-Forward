name: Verify Domain for Cloud Run

on:
  workflow_dispatch:

env:
  PROJECT_ID: tho-ai-agent
  REGION: us-central1
  SERVICE: project-go-forward
  DOMAIN: texashomeoutlet.com

jobs:
  verify-domain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF, keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: 'beta'

      - name: Set gcloud run region property
        run: gcloud config set run/region ${{ env.REGION }}

      - name: Get verification token via Cloud Run API
        run: |
          echo "## Domain Verification for ${{ env.DOMAIN }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Get access token
          TOKEN=$(gcloud auth print-access-token)
          echo "Got access token (length: ${#TOKEN})" >> $GITHUB_STEP_SUMMARY

          # Try to create domain mapping via API and capture response
          echo "### API response for domain mapping creation" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          curl -s -X POST \
            "https://run.googleapis.com/v1/namespaces/${{ env.PROJECT_ID }}/domainmappings" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "apiVersion": "domains.cloudrun.com/v1",
              "kind": "DomainMapping",
              "metadata": {"name": "'${{ env.DOMAIN }}'"},
              "spec": {"routeName": "'${{ env.SERVICE }}'"}
            }' >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Also try gcloud domains verify with proper stderr capture
          echo "### gcloud domains verify output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          gcloud domains verify ${{ env.DOMAIN }} --project=${{ env.PROJECT_ID }} >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # List existing domain mappings
          echo "### Existing domain mappings" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          gcloud beta run domain-mappings list --project=${{ env.PROJECT_ID }} >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # List verified domains
          echo "### Verified domains" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          gcloud domains list --project=${{ env.PROJECT_ID }} >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### DNS Records for ${{ env.DOMAIN }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          dig +short A ${{ env.DOMAIN }} >> $GITHUB_STEP_SUMMARY 2>&1 || true
          dig +short NS ${{ env.DOMAIN }} >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "**Next steps:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Add the verification TXT record to Turbify/Route 53" >> $GITHUB_STEP_SUMMARY
          echo "2. Wait for DNS propagation (up to 5 min with TTL 300)" >> $GITHUB_STEP_SUMMARY
          echo "3. Run the Add Custom Domain Mappings workflow again" >> $GITHUB_STEP_SUMMARY
