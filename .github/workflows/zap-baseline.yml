name: OWASP ZAP baseline

# COD-132 / THO security roadmap R16. Free passive baseline of the public
# production origin. Schedule and manual dispatch only: this is not a pull
# request check and must not be a required status check. No repository
# secrets, no active scan, no candidate host, and no other target.

on:
  schedule:
    - cron: '17 6 * * 2' # Tuesdays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zap-baseline
  cancel-in-progress: false

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Resolve the public production origin
        run: |
          set -euo pipefail
          origin="$(python3 scripts/zap_baseline.py origin)"
          case "$origin" in
            https://*) ;;
            *) echo "Refusing scan target." >&2; exit 1 ;;
          esac
          printf 'ZAP_TARGET=%s\n' "$origin" >> "$GITHUB_ENV"
          echo "Scan target: $origin"

      - name: Passive baseline scan
        id: zap
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ env.ZAP_TARGET }}
          docker_name: ghcr.io/zaproxy/zaproxy:stable
          rules_file_name: .zap/rules.tsv
          # -I: medium and below do not fail the container.
          # -m 1: one minute of spidering, the baseline default.
          # -T 20: cap startup and passive scanning.
          # No ajax spider, no alpha rules, no active scan.
          cmd_options: '-I -m 1 -T 20'
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-baseline-report

      - name: Upload report if the scan stopped early
        if: failure() && steps.zap.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zap-baseline-report
          path: |
            report_html.html
            report_json.json
            report_md.md
          if-no-files-found: ignore
          retention-days: 30

      - name: Fail only on high-severity alerts
        if: steps.zap.outcome == 'success'
        run: python3 scripts/zap_baseline.py gate --report report_json.json --rules .zap/rules.tsv --target "$ZAP_TARGET"
