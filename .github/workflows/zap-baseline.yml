name: ZAP baseline

# COD-132 / THO security roadmap R16. Passive OWASP ZAP baseline of the public
# storefront. Report-only: alerts are artifacts and do not fail this job, and
# this workflow is not a pull_request check, so it cannot block a merge.
# Unauthenticated. No secrets. Baseline spider plus passive rules only.
# Read docs/ZAP_BASELINE.md before turning findings into a failing check.

on:
  schedule:
    - cron: '41 14 * * 1'   # Mondays 08:41 MT
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zap-baseline
  cancel-in-progress: false

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Confirm public health endpoint
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --location --max-time 20 \
            --output "$RUNNER_TEMP/healthz.json" \
            "https://www.texashomeoutlet.com/healthz/"
          python3 -c 'import json,pathlib,os; body=json.loads(pathlib.Path(os.environ["RUNNER_TEMP"], "healthz.json").read_text()); assert body.get("status")=="ok", body; print("healthz status=ok")'

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          # Issue writing is off. An empty token keeps the default GITHUB_TOKEN
          # from being handed to the action. No repository secret is used.
          token: ''
          # ghcr.io/zaproxy/zaproxy:2.17.0 index digest, resolved 2026-10-26.
          # Same digest as :stable on that date. Do not float the tag.
          docker_name: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:030d3df57735dacbb83464854758e674dd9ad01d79d12a129a8e58b1fd384238
          target: https://www.texashomeoutlet.com
          rules_file_name: .zap/rules.tsv
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-baseline-report

      - name: Note how to read the report
        if: always()
        run: |
          {
            echo '## ZAP baseline (report only)'
            echo
            echo 'Passive baseline of https://www.texashomeoutlet.com. Alerts do not fail this job.'
            echo 'Download the `zap-baseline-report` artifact (`report_html.html`, `report_json.json`).'
            echo 'See docs/ZAP_BASELINE.md before failing the job on High alerts.'
          } >> "$GITHUB_STEP_SUMMARY"
