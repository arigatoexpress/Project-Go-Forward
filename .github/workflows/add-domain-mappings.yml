name: Add Custom Domain Mappings

on:
  workflow_dispatch:

env:
  PROJECT_ID: tho-ai-agent
  REGION: us-central1
  SERVICE: project-go-forward
  # Opt into Node.js 24 to suppress deprecation warnings for the v4/v5
  # action majors below, which still run on Node.js 20. The announced
  # default-switch date (2026-06-02) has passed; revisit when upgrading
  # those actions to Node-24-native majors.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  add-domain-mappings:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF, keyless)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
        with:
          install_components: 'beta'

      - name: Debug gcloud version and domain-mappings help
        run: |
          gcloud --version
          gcloud run domain-mappings create --help || true

      - name: Set gcloud run region property
        run: gcloud config set run/region ${{ env.REGION }}

      - name: Add texashomeoutlet.com domain mapping
        run: |
          set -x
          gcloud beta run domain-mappings create \
            --service=${{ env.SERVICE }} \
            --project=${{ env.PROJECT_ID }} \
            --domain=texashomeoutlet.com \
            --quiet

      - name: Add www.texashomeoutlet.com domain mapping
        run: |
          set -x
          gcloud beta run domain-mappings create \
            --service=${{ env.SERVICE }} \
            --project=${{ env.PROJECT_ID }} \
            --domain=www.texashomeoutlet.com \
            --quiet

      - name: Show required DNS records
        run: |
          echo "=== DNS records to add in Turbify/Route 53 ==="
          echo ""
          echo "Apex (texashomeoutlet.com): 4x A records"
          echo "  216.239.32.21"
          echo "  216.239.34.21"
          echo "  216.239.36.21"
          echo "  216.239.38.21"
          echo ""
          echo "WWW (www.texashomeoutlet.com): CNAME"
          echo "  ghs.googlehosted.com"
          echo ""
          echo "MX records: LEAVE AS-IS (Yahoo/Turbify mail)"
          echo ""
          echo "After adding domain mappings, wait for Google to verify (can take 5-30 min)."
          echo "Then update DNS in Turbify/Route 53 and wait for propagation."
