name: Dependency audit

# COD-125 / THO security roadmap R9. Free replacement for paid container scanning:
# fails on known-vulnerable Python and npm packages. No advisory exceptions are
# in effect — the ADK-capped OpenTelemetry exception was removed 2026-11-13 when
# ADK 2.14.1 (opentelemetry-api <=1.45.2) admitted the 1.45.1+ fix.
# Read-only: no secrets, no deploy, no GCP.

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 13 * * 1'   # Mondays 07:17 MT
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: pip-audit (runtime and development requirements)
        run: |
          python -m pip install --quiet pip-audit==2.9.0
          set +e
          pip-audit -r requirements.txt -r requirements-dev.txt \
            --progress-spinner off --desc off \
            > "$RUNNER_TEMP/pip-audit.txt" 2>&1
          status=$?
          cat "$RUNNER_TEMP/pip-audit.txt"
          {
            echo '## pip-audit: runtime and development requirements'
            echo '```text'
            cat "$RUNNER_TEMP/pip-audit.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          printf '\nAudit exit status: %s\n' "$status"
          exit "$status"
      - name: npm audit (frontend, e2e)
        run: |
          set +e
          overall=0
          for d in frontend e2e; do
            [ -f "$d/package-lock.json" ] || continue
            audit_file="$RUNNER_TEMP/npm-audit-$d.txt"
            (cd "$d" && npm audit --package-lock-only --audit-level=high) \
              > "$audit_file" 2>&1
            status=$?
            cat "$audit_file"
            {
              echo "## npm audit: $d (high and above)"
              echo '```text'
              cat "$audit_file"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$status" -ne 0 ]; then overall=$status; fi
          done
          exit "$overall"
