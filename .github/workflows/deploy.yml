name: Deploy to Cloud Run

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: tho-ai-agent
  REGION: us-central1
  SERVICE: project-go-forward

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run ruff on health probe tests
        run: python -m ruff check tests/test_healthz.py

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Run unit tests (no Firestore/GCS)
        run: |
          python -m pytest tests/test_*.py -v --tb=short
        env:
          PYTHONPATH: .

  build-and-deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      statuses: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF, keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build and deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --source . \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --update-env-vars=APP_VERSION=${{ github.sha }} \
            --update-secrets=ADMIN_PIN_HASH=admin-pin-hash:latest \
            --liveness-probe=httpGet.path=/healthz,httpGet.port=8080,periodSeconds=30,timeoutSeconds=5,failureThreshold=3 \
            --quiet

      - name: Verify deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_SHA: ${{ github.sha }}
          GH_REPO: ${{ github.repository }}
          GH_SERVER: ${{ github.server_url }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          # 1. Resolve the live Cloud Run URL
          URL=$(gcloud run services describe ${{ env.SERVICE }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format='value(status.url)')
          echo "Deployed URL: $URL"

          # 2. Full production smoke: health, inventory >= 40 homes, SPA deep-links, admin protection
          echo "=== Production smoke script ==="
          python scripts/production_smoke.py \
            --base-url "$URL" \
            --min-homes 40 \
            --timeout 30
          echo "Smoke script: PASS"

          # 3. 50-parallel healthz probes: Cache-Control: no-store + no schema-text placeholders
          echo "=== 50-parallel healthz probes ==="
          PROBE_URL="$URL" python scripts/probe_healthz.py
          echo "50-probe healthz: PASS"

          # 4. SHA verification — warn only, never fail (manual deploys won't match)
          echo "=== SHA verification ==="
          DEPLOYED_SHA=""
          if HEALTHZ_BODY=$(curl -sf --max-time 15 "$URL/healthz/" 2>/dev/null); then
            DEPLOYED_SHA=$(echo "$HEALTHZ_BODY" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('version',''))" \
              2>/dev/null) || DEPLOYED_SHA=""
          fi
          EXPECTED_SHA="$GH_SHA"
          if [ "$DEPLOYED_SHA" = "$EXPECTED_SHA" ]; then
            echo "SHA match: ${DEPLOYED_SHA:0:7}"
            SHA_NOTE="SHA match: ${DEPLOYED_SHA:0:7}"
          else
            echo "WARNING: SHA mismatch deployed=${DEPLOYED_SHA:0:7} expected=${EXPECTED_SHA:0:7} (possible manual deploy)"
            SHA_NOTE="SHA mismatch (deployed: ${DEPLOYED_SHA:0:7}, expected: ${EXPECTED_SHA:0:7})"
          fi

          # 5. Post commit status summarising all checks
          echo "=== Posting commit status ==="
          RUN_URL="${GH_SERVER}/${GH_REPO}/actions/runs/${GH_RUN_ID}"
          SUMMARY="Deploy verified: smoke=PASS 50-probe-healthz=PASS ${SHA_NOTE}"
          curl -sf -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${GH_REPO}/statuses/${GH_SHA}" \
            -d "{\"state\":\"success\",\"context\":\"post-deploy-verify\",\"description\":\"${SUMMARY:0:140}\",\"target_url\":\"${RUN_URL}\"}" \
            || echo "WARNING: Failed to post commit status (non-blocking)"
          echo "Verification complete."
