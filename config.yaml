# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Project Go Forward — Business Configuration
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Edit this file to configure the AI agent for YOUR business.
# All other code reads from this config — no need to touch source files.

business:
  name: "Texas Home Outlet"
  tagline: "Your Dream Home, Our Mission"
  industry: "real_estate"
  
  # Physical location (used by the agent in responses).
  # `address` is the canonical combined string; the structured components below
  # are the single source for forms, legal documents, and notifications.
  # Keep these in sync — a guard test enforces that the zip/city agree.
  address: "10685 FM 1960 East, Huffman, TX 77336"
  street: "10685 FM 1960 East"
  city: "Huffman"
  state: "TX"
  zip: "77336"
  phone: "(281) 324-3020"
  email: "sales@texashomeoutlet.com"
  # Staff who receive new-lead / new-appointment alerts. Fans out to the whole
  # team so no lead is missed. Operative value is the NOTIFICATION_EMAIL env var
  # (comma-separated) read by email_service.py; this line documents the intent.
  notification_email: "ben@texashomeoutlet.com,lee@texashomeoutlet.com,celeste@texashomeoutlet.com,mark@texashomeoutlet.com"
  website: "https://www.texashomeoutlet.com"

  # LocalBusiness SEO fields (schema.org JSON-LD via seo_routes.py). Each optional.
  price_range: "$$"
  # Brand logo for the Organization/LocalBusiness `logo` field (served from
  # frontend/public). Swap to a raster (PNG/JPG) URL if you have one — Google's
  # knowledge-panel logo prefers raster over SVG.
  logo_url: "/tex-icon.svg"
  # Short description used for directory listings and citation sites.
  short_description: "Texas Home Outlet is a manufactured and mobile home dealership serving Huffman, TX and the greater Houston area."
  # Directory categories (primary first) — keep consistent across Google Business Profile,
  # Yelp, Bing Places, Apple Business Connect, and industry directories.
  categories:
    - "Mobile Home Dealer"
    - "Manufactured Home Dealer"
  # Year established, if known (helps directory profiles and knowledge-graph signals).
  year_established: null
  # Cities served — emitted as schema.org areaServed for local relevance.
  area_served:
    - "Huffman"
    - "Humble"
    - "Atascocita"
    - "Crosby"
    - "Kingwood"
    - "New Caney"
    - "Baytown"
    - "Beaumont"
    - "Cleveland"
    - "Conroe"
    - "Livingston"
  # Social / Google Business Profile URLs — FILL IN to strengthen local SEO + map
  # placement (schema.org sameAs): Facebook, Instagram, Google Business Profile, etc.
  same_as: []
  # Exact showroom coordinates for schema.org geo — get lat/lng from your Google
  # Business Profile and fill in (improves Google Maps / local-pack placement).
  geo:
    latitude: null
    longitude: null

  # Operating hours
  hours:
    weekday: "Mon-Fri 9:00 AM - 6:00 PM"
    saturday: "Sat 9:00 AM - 5:00 PM"
    sunday: "Sun Closed"

  # Machine-readable mirror of `hours` for schema.org openingHoursSpecification
  # (LocalBusiness JSON-LD in seo_routes.py). Keep in sync with `hours` above.
  hours_structured:
    - days: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"]
      opens: "09:00"
      closes: "18:00"
    - days: ["Saturday"]
      opens: "09:00"
      closes: "17:00"

agent:
  # The name your AI assistant goes by
  assistant_name: "AI Assistant"

  # Model to use (Gemini via Vertex AI)
  # gemini-2.5-flash supports thinking/planning for better multi-step reasoning
  model: "gemini-2.5-flash"

  # Model generation parameters
  model_config:
    temperature: 0.7          # 0.0 = deterministic, 1.0 = creative
    max_output_tokens: 2048   # Max response length in tokens
    top_p: 0.95               # Nucleus sampling threshold
    top_k: 40                 # Top-k sampling

  # Thinking/planning config (requires gemini-2.5-flash or newer)
  thinking:
    enabled: true
    include_thoughts: true    # Include reasoning in responses
    thinking_budget: 1024     # Token budget for internal reasoning

  # Safety filter level for all agents
  safety_level: "block_low_and_above"  # block_none, block_low_and_above, block_medium_and_above, block_only_high

  # Agent personality and communication style
  personality: "warm, down-to-earth, and conversational — like a friendly neighbor who happens to know everything about manufactured homes. Use casual language, contractions, and a touch of Texas charm. Be genuinely empathetic and human in tone"
  greeting: "Hey there! Welcome to Texas Home Outlet. What can I help you with today?"

  # What your agent specializes in
  specializations:
    - "Product search and recommendations"
    - "Pricing information"
    - "Appointment booking"
    - "Service and warranty support"

product:
  # What you sell (used in agent prompts and search)
  type: "products"  # products, homes, vehicles, services, listings
  singular: "product"
  plural: "products"
  
  # Attributes your products have (mapped to inventory schema)
  primary_attributes:
    - name: "category"
      label: "Category"
      type: "string"
    - name: "size"
      label: "Size" 
      type: "string"
    - name: "color"
      label: "Color"
      type: "string"
  
  # Spec fields shown on product cards
  spec_fields:
    - key: "beds"
      label: "Beds"
      icon: "🛏️"
    - key: "baths"
      label: "Baths"
      icon: "🚿"
    - key: "sq_ft"
      label: "Sq Ft"
      icon: "📐"

  # Pricing
  financing_available: false

frontend:
  # Branding
  primary_color: "#1a56db"
  accent_color: "#e74c3c"
  logo_path: "public/tex-icon.svg"
  
  # Chat interface
  placeholder_text: "Ask about homes, pricing, financing, or schedule a visit..."
  disclaimer: "AI can make mistakes. Please verify details with a human agent."

deployment:
  # Google Cloud
  project_id: "tho-ai-agent"
  region: "us-central1"
  service_name: "tho-agent"
  
scraper:
  # Website to scrape inventory from
  target_url: "https://www.texashomeoutlet.com/inventory"
  # CSS selectors for scraping (customize per website)
  selectors:
    card: ".product-card"
    name: ".product-name"
    price: ".product-price"
    image: "img"
    link: "a"

# Feature flags (fallback source — env vars FF_<NAME>/<NAME> take precedence;
# see tools/feature_flags.py). Values here are read at call time, so a config
# flip ships via the normal PR flow with no separate env change.
feature_flags:
  # Staff review-request helper (Celeste approved rollout 2026-07-03). Public
  # write-review deep link for the verified THO Google Business place
  # (ChIJkaBdugirQIYROqKB6XUKQk8 = Texas Home Outlet, 10685 FM 1960 E, Huffman).
  # Not a secret. Override with env GOOGLE_REVIEW_LINK (e.g. a g.page short URL).
  GOOGLE_REVIEW_LINK: "https://search.google.com/local/writereview?placeid=ChIJkaBdugirQIYROqKB6XUKQk8"

# Notion "Command Center" integration. DB ids are identifiers, NOT secrets — the
# only secret is NOTION_TOKEN (Secret Manager). The Ops Copilot reads these
# PII-free (count-by-status) when NOTION_COMMAND_CENTER=on. Each id can also be
# overridden by env NOTION_<KEY>_DB_ID if you'd rather not commit them.
notion:
  databases:
    delivery_tracker: "34e6688d-bec6-81b7-966b-c7bfebeb7a27"   # 🔧 Delivery Tracker (installations)
    cs_survey: "34e6688d-bec6-818b-abd5-f6a095be6cb9"          # 🤝 Customer satisfaction surveys
    service_warranty: "34e6688d-bec6-8190-9a2c-dc0f5db19de6"   # 🛠️ Service & Warranty
    title: "34e6688d-bec6-81db-b2a6-ddf06dabe151"              # 📋 Title processing
    collections: "34e6688d-bec6-81c8-8430-ec5b1d2efd6d"        # 💰 Collections
    insurance: "34e6688d-bec6-8196-84a6-fc3c64ac2768"          # Insurance / KIP
    lead_pipeline: "34e6688d-bec6-81b3-b3a3-d176c0f7ce44"      # 👤 Lead Pipeline ("up log")
