<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Go Forward v1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .version {
            color: #667eea;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #dcfce7;
            color: #166534;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 30px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .endpoints {
            background: #f8fafc;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .endpoints h3 {
            font-size: 14px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 15px;
        }
        .endpoint {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            background: white;
            border-radius: 8px;
            margin-bottom: 8px;
            font-family: monospace;
            font-size: 13px;
        }
        .endpoint:last-child {
            margin-bottom: 0;
        }
        .method {
            background: #667eea;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }
        .method.get {
            background: #22c55e;
        }
        .method.post {
            background: #3b82f6;
        }
        .path {
            color: #334155;
        }
        .docs-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #667eea;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 500;
            transition: background 0.2s;
        }
        .docs-link:hover {
            background: #5a67d8;
        }
        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
            color: #94a3b8;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Project Go Forward</h1>
        <div class="version">v1.0.0 — Deployable Vertical Slice</div>
        
        <div class="status">
            <span class="status-dot"></span>
            <span>Operational</span>
        </div>
        
        <div class="endpoints">
            <h3>API Endpoints</h3>
            <div class="endpoint">
                <span class="method get">GET</span>
                <span class="path">/health</span>
            </div>
            <div class="endpoint">
                <span class="method post">POST</span>
                <span class="path">/chat</span>
            </div>
            <div class="endpoint">
                <span class="method post">POST</span>
                <span class="path">/leads</span>
            </div>
            <div class="endpoint">
                <span class="method get">GET</span>
                <span class="path">/leads</span>
            </div>
        </div>
        
        <a href="/docs" class="docs-link">
            <span>📚</span>
            <span>View API Documentation</span>
        </a>
        
        <div class="footer">
            Built with FastAPI • Ready for Cloud Run • 20 Tests Passing
        </div>
    </div>
</body>
</html>
