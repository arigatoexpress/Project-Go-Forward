# NOT RUN. Secret resource ids only. No secret values.
# Owner checklist: docs/OPERATOR_DOCUSEAL_RESEND_CHECKLIST.md
# Do not add app bindings to .github/workflows/deploy.yml until each secret exists.
status: NOT_RUN
app_service:
  update_secrets:
    - env: RESEND_API_KEY
      secret: resend-api-key  # pragma: allowlist secret
      version: latest
    - env: DOCUSEAL_API_URL
      secret: docuseal-api-url  # pragma: allowlist secret
      version: latest
    - env: DOCUSEAL_API_TOKEN
      secret: docuseal-api-token  # pragma: allowlist secret
      version: latest
    - env: DOCUSEAL_WEBHOOK_SECRET
      secret: docuseal-webhook-secret  # pragma: allowlist secret
      version: latest
docuseal_service:
  # Referenced by .github/workflows/deploy-docuseal.yml after confirm=YES.
  # DATABASE_URL is assembled at deploy time from Cloud SQL plus docuseal-db-password.
  secrets:
    - secret: docuseal-secret-key-base  # pragma: allowlist secret
      env: SECRET_KEY_BASE
    - secret: docuseal-db-password  # pragma: allowlist secret
      note: Cloud SQL password. Not an app env var and not committed.
