    <rect x="26" y="28" width="92" height="18" rx="9" fill="#7c3aed"/>
    <rect x="26" y="68" width="258" height="16" rx="8" fill="#c4b5fd"/>
    <rect x="26" y="100" width="258" height="16" rx="8" fill="#c4b5fd"/>
    <rect x="26" y="132" width="168" height="16" rx="8" fill="#c4b5fd"/>
    <rect x="222" y="126" width="62" height="36" rx="18" fill="#7c3aed"/>
    <text x="26" y="174" fill="#0f172a" font-family="Inter, ui-sans-serif, system-ui" font-size="18" font-weight="800">CRM Pipeline</text>

    <rect x="344" y="0" width="310" height="190" rx="24" fill="#111827" filter="url(#softShadow)"/>
    <rect x="370" y="28" width="258" height="22" rx="11" fill="#f59e0b"/>
    <path d="M382 138 L430 104 L478 118 L526 82 L590 98" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="526" cy="82" r="9" fill="#38bdf8"/>
    <text x="370" y="174" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui" font-size="18" font-weight="800">Ad Studio + Analytics</text>
