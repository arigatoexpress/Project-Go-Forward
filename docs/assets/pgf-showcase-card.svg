    <rect x="370" y="28" width="258" height="18" rx="9" fill="#0f766e"/>
    <rect x="370" y="68" width="70" height="70" rx="16" fill="#ccfbf1"/>
    <rect x="456" y="68" width="70" height="70" rx="16" fill="#ccfbf1"/>
    <rect x="542" y="68" width="70" height="70" rx="16" fill="#ccfbf1"/>
