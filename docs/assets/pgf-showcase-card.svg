<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 640" role="img" aria-labelledby="title desc">
  <title id="title">Texas Home Outlet product showcase card</title>
  <desc id="desc">A polished product card showing the THO app's public storefront, document center, CRM, analytics, and Ad Studio surfaces.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.52" stop-color="#0d253f"/>
      <stop offset="1" stop-color="#0f3b3d"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#f8d56b"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1440" height="640" rx="34" fill="url(#bg)"/>
  <path d="M0 510 C220 470 330 565 540 520 C800 464 920 355 1180 398 C1300 418 1370 465 1440 442 L1440 640 L0 640 Z" fill="#0f766e" opacity="0.34"/>
  <path d="M92 92 H1348 V548 H92 Z" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>

  <g transform="translate(126 112)">
    <rect x="0" y="0" width="500" height="416" rx="26" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.18" filter="url(#softShadow)"/>
    <text x="42" y="70" fill="#a7f3d0" font-family="Inter, ui-sans-serif, system-ui" font-size="18" letter-spacing="4">LIVE THO APP</text>
    <text x="42" y="132" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui" font-size="54" font-weight="800">Project Go Forward</text>
    <text x="42" y="180" fill="#dbeafe" font-family="Inter, ui-sans-serif, system-ui" font-size="24">Sales, inventory, CRM, documents, and marketing operations for Texas Home Outlet.</text>
    <rect x="42" y="236" width="150" height="42" rx="21" fill="url(#gold)"/>
    <text x="71" y="264" fill="#111827" font-family="Inter, ui-sans-serif, system-ui" font-size="16" font-weight="800">Public site</text>
    <rect x="210" y="236" width="170" height="42" rx="21" fill="#0ea5e9" opacity="0.92"/>
    <text x="239" y="264" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui" font-size="16" font-weight="800">Admin console</text>
    <g transform="translate(42 322)">
      <circle cx="12" cy="12" r="6" fill="#22c55e"/>
      <text x="32" y="18" fill="#d1fae5" font-family="Inter, ui-sans-serif, system-ui" font-size="16">Verified live: /health, /healthz/, inventory context</text>
    </g>
  </g>

  <g transform="translate(690 100)">
