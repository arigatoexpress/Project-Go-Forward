[project]
name = "project-go-forward"
version = "0.1.0"
description = "Texas Home Outlet AI application"
requires-python = ">=3.11,<3.12"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  ".claude/worktrees",
  ".venv",
  "frontend/dist",
  "frontend/node_modules",
  "data/generated_ads",
  "data/generated_docs",
  "data/generated_videos",
  "data/rag_index",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# str+Enum classes serialize via their value in API payloads and Firestore
# documents; converting to StrEnum changes str() behavior and is not worth
# the regression risk on a live system.
"database/models.py" = ["UP042"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
